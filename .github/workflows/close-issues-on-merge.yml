
name: Close linked issues when PR is merged

on:
  pull_request:
    types: [closed]
    branches:
      - fix/bug-bash

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  close-linked-issues:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
      - name: Close issues referenced in merged PR
        uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.pull_request.body || "";

            const regex = /(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\s*:?\s*#(\d+)/gi;

            const issueNumbers = [...body.matchAll(regex)]
              .map(match => Number(match[1]));

            const uniqueIssues = [...new Set(issueNumbers)];

            for (const issue_number of uniqueIssues) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number,
                state: "closed"
              });

              core.info(`Closed issue #${issue_number}`);
            }

            if (uniqueIssues.length === 0) {
              core.info("No closing issue references found in PR description.");
            }
