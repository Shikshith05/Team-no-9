# Gateway (SAD 4.9; PRJ-SR-001 TLS 1.2+, PWM-NF-003). The only container with
# published ports. Terminates TLS, serves the React build and forwards /api.

worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  sendfile on;
  keepalive_timeout 65;
  server_tokens off;
  client_max_body_size 1m;

  gzip on;
  gzip_min_length 1024;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # Docker's DNS. Looking the backend up per request, instead of once at startup,
  # means nginx can start before it and keeps working after it is recreated.
  resolver 127.0.0.11 valid=10s;

  # Plain HTTP only redirects. SRS AC-SR-001 and SAD 3.9 say HTTP is refused; the
  # team chose a redirect instead so that typed http:// addresses still work.
  server {
    listen 80;
    listen [::]:80;
    server_name _;

    location / {
      return 301 https://$host$request_uri;
    }
  }

  # For the container's health check. It listens on the container's loopback and
  # its port is not published, so it cannot be reached from outside. (An allow rule
  # on port 80 is not enough: Docker's port forwarding can hide the client address.)
  server {
    listen 127.0.0.1:8081;
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name _;

    ssl_certificate /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    # PRJ-SR-001: nothing older than TLS 1.2.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Security headers (SAD 3.9, TC-Sec-06). nginx drops these if a location has its
    # own add_header, so the locations below must not use add_header.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;
    # The token is kept in localStorage (docs/auth-decision.md), so scripts are
    # limited to this origin, with no inline scripts.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
      set $backend http://backend:5000;
      proxy_pass $backend;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;

      # The backend sets these too (helmet). The gateway's versions apply, so each
      # header appears only once.
      proxy_hide_header Strict-Transport-Security;
      proxy_hide_header X-Content-Type-Options;
      proxy_hide_header X-Frame-Options;
      proxy_hide_header Referrer-Policy;
      proxy_hide_header Content-Security-Policy;
    }

    # File names contain a content hash, so they can be cached for a long time.
    location /assets/ {
      expires 1y;
      try_files $uri =404;
    }

    # Always revalidate the page that names those files.
    location = /index.html {
      expires -1;
    }

    # SPA fallback.
    location / {
      try_files $uri $uri/ /index.html;
    }
  }
}
