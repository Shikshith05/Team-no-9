# Deployment from SAD 4.9. Secrets come from .env and nothing is hard-coded.
# Setup: see "Run with Docker" in README.md.
#
# Only the gateway publishes ports. PostgreSQL sits on an internal network that
# only the backend joins, so it cannot be reached from outside Docker.
#
# The backend's health check is in backend/Dockerfile.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    environment:
      NODE_ENV: production
      PORT: "5000"
      DB_HOST: postgres
      DB_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env. Generate one with openssl rand -hex 32}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-24h}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-https://localhost}
      STOCK_PRICE_API_URL: ${STOCK_PRICE_API_URL:-}
      STOCK_PRICE_API_KEY: ${STOCK_PRICE_API_KEY:-}
      GOLD_PRICE_API_URL: ${GOLD_PRICE_API_URL:-}
      GOLD_PRICE_API_KEY: ${GOLD_PRICE_API_KEY:-}
    expose:
      - "5000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - edge
      - data
    restart: unless-stopped

  # PRJ-SR-001: TLS 1.2+ gateway; also serves the React build.
  gateway:
    build:
      context: ./frontend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - type: bind
        source: ./nginx.conf
        target: /etc/nginx/nginx.conf
        read_only: true
      # Create these first with scripts/gen-dev-certs.sh. Without them nginx exits
      # with "cannot load certificate" and the gateway keeps restarting.
      - type: bind
        source: ./certs
        target: /etc/nginx/certs
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - edge
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8081/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

networks:
  edge:
  data:
    internal: true

volumes:
  postgres-data:
